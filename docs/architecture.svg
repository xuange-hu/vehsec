<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>

  <!-- AI agents -->
  <g>
    <rect x="100" y="40" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="200" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#312E81">Claude Code</text>
    <rect x="340" y="40" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="440" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#312E81">Cursor</text>
    <rect x="580" y="40" width="200" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="680" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#312E81">Cline / OpenCode</text>
  </g>
  <text x="440" y="26" text-anchor="middle" font-size="12" fill="#64748B">AI coding agents (MCP clients)</text>

  <path d="M 200 86 L 200 108 Q 200 116 210 116 L 430 116" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 440 86 L 440 116" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 680 86 L 680 108 Q 680 116 670 116 L 450 116" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MCP server -->
  <rect x="290" y="120" width="300" height="54" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="440" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">vehsec mcp  ·  MCP Server (stdio)</text>
  <text x="440" y="163" text-anchor="middle" font-size="11" fill="#047857">20 tools: can · uds · seedkey · v2x · icsim · doip · dbc · j1939 · iso-tp</text>

  <path d="M 440 174 L 440 198" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- core library -->
  <rect x="240" y="200" width="400" height="50" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="440" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">vehsec core library (Python)</text>
  <text x="440" y="241" text-anchor="middle" font-size="11" fill="#475569">shared by CLI · TUI · MCP — one implementation, three surfaces</text>

  <path d="M 440 250 L 440 268" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- modules -->
  <rect x="140" y="270" width="600" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <g font-size="12" font-weight="600" fill="#1E293B">
    <rect x="160" y="280" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="210" y="303" text-anchor="middle">CAN</text>
    <rect x="275" y="280" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="325" y="303" text-anchor="middle">UDS</text>
    <rect x="390" y="280" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="440" y="303" text-anchor="middle">Seed-Key</text>
    <rect x="505" y="280" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="555" y="303" text-anchor="middle">V2X</text>
    <rect x="620" y="280" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="670" y="303" text-anchor="middle">ICSim</text>
  </g>

  <path d="M 440 326 L 440 348" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- transport -->
  <rect x="290" y="350" width="300" height="44" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="440" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">python-can  ·  virtual / socketcan</text>
  <text x="440" y="387" text-anchor="middle" font-size="11" fill="#92400E">ISO-TP (can-isotp) for UDS · no hardware required</text>

  <path d="M 300 394 L 210 414" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 440 394 L 440 414" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 580 394 L 670 414" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- targets -->
  <g>
    <rect x="100" y="418" width="200" height="42" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="200" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1D1D">ICSim 虚拟仪表盘</text>
    <rect x="340" y="418" width="200" height="42" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="440" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1D1D">UDSim 虚拟 ECU</text>
    <rect x="580" y="418" width="200" height="42" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="680" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1D1D">实车 OBD-II（授权）</text>
  </g>
</svg>
