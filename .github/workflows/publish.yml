name: Publish to PyPI

# Why this file exists
# --------------------
# The README's headline install path is `uvx --from "vehsec[mcp]"`, which
# resolves from PyPI. Until the project is actually *on* PyPI that command
# 404s, so every visitor's first action fails. This workflow removes the
# blocker permanently: it builds and uploads on every GitHub Release.
#
# It uses PyPI **Trusted Publishing** (OIDC), so there is no API token to
# rotate or leak. One-time setup, done once in the browser:
#   https://pypi.org/manage/account/publishing/
#     owner:       xuange-hu
#     repository:  vehsec
#     workflow:    publish.yml
#     environment: pypi
# Until that is registered the preflight job skips the publish with a notice and nothing
# else in CI is affected.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Upload to TestPyPI instead of PyPI"
        type: choice
        default: "pypi"
        options: [pypi, testpypi]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Is the project registered on PyPI?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # Trusted Publishing needs the project to exist on PyPI *and* a publisher
      # configured for this repository. Until that one-time setup happens, the
      # upload would fail with "invalid-publisher" and paint a red X on every
      # release - a red X that means "not set up yet", which nobody can tell
      # apart from "the package is broken". So: ask first, skip deliberately,
      # and start publishing on the next release after the setup is done.
      - id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/vehsec/json || true)
          echo "pypi status: $code"
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::vehsec is not on PyPI yet. Register the project and a Trusted Publisher for xuange-hu/vehsec, then re-run this workflow."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    timeout-minutes: 15
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: twine check dist/*

      # A wheel that installs but cannot import is the exact bug this
      # workflow exists to prevent; install it in a clean venv and run it.
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv .smoke
          ./.smoke/bin/python -m pip install --quiet dist/*.whl
          ./.smoke/bin/vehsec --help > /dev/null
          ./.smoke/bin/vehsec mcp --check | tail -2

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

          retention-days: 7
  publish:
    timeout-minutes: 15
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' || inputs.repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
