name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[all]"
          python -m pip install pytest ruff

      - name: Lint (syntax / undefined names only)
        run: ruff check src tests --select=E9,F63,F7,F82

      - name: Tests
        run: pytest -q

      # The README tells people to install the console scripts and run them.
      # If an entry point stops resolving, no behavioural test catches it.
      - name: Console scripts / MCP manifest
        run: |
          set -e
          vehsec --help >/dev/null
          vehsec mcp --check | tee /tmp/manifest.txt
          grep -q "31 tools" /tmp/manifest.txt
          python -c "from vehsec.mcp_server import run; assert callable(run)"

      # Really run every solver: a lab that stops working is a broken README.
      # v2x writes a signature dump, so point it outside the working tree.
      - name: Labs (all five solvers must succeed)
        run: |
          set -e
          for lab in uds-did-decrypt delta-forge-patchchain sentinel2-can-statemachine seedkey-recover; do
            echo "== $lab"
            python "labs/$lab/solve.py"
          done
          echo "== v2x-ecdsa-nonce"
          python labs/v2x-ecdsa-nonce/solve.py --gen 20 --out "$RUNNER_TEMP/v2x-sigs.json"
          python labs/v2x-ecdsa-nonce/solve.py --gen 20 --no-reuse --out "$RUNNER_TEMP/v2x-clean.json"

      # Soft check: the README test badge went stale twice (277 vs 282, 62 vs 57)
      # and nobody noticed. Print the mismatch instead of failing the build --
      # a wrong number should not turn CI red, but it must show in every log.
      - name: README test-count badge matches reality
        if: runner.os == 'Linux'
        run: |
          # -o addopts= neutralises a project-level addopts="-q": combined with the
          # -q below it becomes -qq, and pytest -qq drops the "N tests collected"
          # summary line, which emptied this check once already.
          actual=$(pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} badge=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::warning::README badge says $claimed but pytest collects $actual - update README.md"
          fi

  fresh-clone:
    # vehsec is not a zero-dependency project, so "pytest with nothing
    # installed" is not a claim it can make. What it can claim is the next
    # best thing: a clone plus the *base* dependencies - no [all] extras, no
    # pre-installed package - is enough for the suite to collect and run.
    # Extras are opt-in and every test that needs one says so with
    # `pytest.importorskip`, so this job also proves no test leaks a hard
    # dependency on textual, mcp or cryptography.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Base dependencies and pytest, no extras, no editable install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: A clone with base deps can run its own tests
        run: python -m pytest -q
