version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x renamed FastMCP -> MCPServer and moved the import path; the
      # server in this repo is written against the 1.x line and test_packaging
      # pins it below 2. A major bump here can never pass CI.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
