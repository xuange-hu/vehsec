[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehsec"
version = "0.3.0"
description = "Vehicle security toolkit: CAN/UDS/Seed-Key/V2X/ICSim as a CLI, TUI and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
keywords = ["can", "uds", "automotive", "vehicle-security", "car-hacking", "mcp", "v2x", "ecu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: Education",
]
# Base deps must be enough to run the *declared console script* `vehsec`.
# `click`/`rich` live here rather than in the `cli` extra on purpose:
# `pip install vehsec && vehsec --help` used to die with
# ModuleNotFoundError because `[project.scripts]` points at vehsec.cli
# while its deps were optional. See tests/test_packaging.py — the contract
# is asserted there so it cannot silently regress again.
dependencies = [
    "python-can>=4.3,<5",
    "can-isotp>=1.0,<3",
    "udsoncan>=1.21,<2",
    "ecdsa>=0.19,<1",
    "click>=8.1,<9",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
# kept in sync with base deps so every documented command keeps resolving
cli = ["click>=8.1,<9", "rich>=13.7,<15"]
tui = ["textual>=0.60,<2"]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8.0,<10", "ruff>=0.9,<1", "pre-commit>=4.0,<5", "Pillow>=10.0,<12"]
# only needed to *mint* key material for the TLS simulator; parsing and
# auditing certificates stays dependency-free on purpose
tls = ["cryptography>=42,<47"]
all = ["click>=8.1,<9", "rich>=13.7,<15", "textual>=0.60,<2", "mcp>=1.2,<2", "cryptography>=42,<47"]

[project.scripts]
vehsec = "vehsec.cli:main"
# dedicated entry point so `uvx --from vehsec[mcp] vehsec-mcp` works with no
# clone, no venv and no `python -m` incantation
vehsec-mcp = "vehsec.mcp_server:run"

[project.urls]
Homepage = "https://github.com/xuange-hu/vehsec"
Repository = "https://github.com/xuange-hu/vehsec"

[tool.setuptools.packages.find]
where = ["src"]

# --- tooling --------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# keep the default rule set out of CI: only syntax/undefined-name errors gate merges
select = ["E9", "F63", "F7", "F82"]
